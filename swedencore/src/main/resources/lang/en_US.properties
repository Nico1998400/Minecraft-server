# NORDIA — English
# MiniMessage format. Placeholders such as <amount> are filled in by the plugin and never parsed as tags.
# Every key must exist in every language file with the same placeholders (enforced by tests).

prefix=<gradient:#3b82c4:#7cc4e8><bold>NORDIA</bold></gradient> <dark_gray>»</dark_gray>

