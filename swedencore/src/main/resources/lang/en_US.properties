# NORDIA — English
# MiniMessage format. Placeholders such as <amount> are filled in by the plugin and never parsed as tags.
# Every key must exist in every language file with the same placeholders (enforced by tests).

prefix=<gradient:#3b82c4:#7cc4e8><bold>NORDIA</bold></gradient> <dark_gray>»</dark_gray>

# ── Login ──
login.unavailable=<red>NORDIA is temporarily unavailable. Please try again shortly.</red>
join.welcome_first=<prefix> <gray>Welcome to NORDIA, <aqua><player></aqua>! You start with <gold><amount></gold>. Find a job, learn a trade and build your life.</gray>
join.welcome_back=<prefix> <gray>Welcome back, <aqua><player></aqua>.</gray>

# ── Economy ──
economy.balance.self=<prefix> <gray>Your balance: <gold><balance></gold></gray>
economy.balance.other=<prefix> <gray>Balance of <aqua><player></aqua>: <gold><balance></gold></gray>
economy.pay.sent=<prefix> <gray>You paid <gold><amount></gold> to <aqua><player></aqua>. New balance: <gold><balance></gold></gray>
economy.pay.received=<prefix> <gray>You received <gold><amount></gold> from <aqua><player></aqua>.</gray>
economy.transactions.header=<prefix> <gray>Latest <count> transactions:</gray>
economy.transactions.entry_in=<dark_gray><date></dark_gray> <green>+<amount></green> <gray><type> · <counterparty></gray> <dark_gray>(balance <balance>)</dark_gray>
economy.transactions.entry_out=<dark_gray><date></dark_gray> <red>-<amount></red> <gray><type> · <counterparty></gray> <dark_gray>(balance <balance>)</dark_gray>
economy.transactions.empty=<prefix> <gray>You have no transactions yet.</gray>
economy.counterparty.SYSTEM=NORDIA
economy.counterparty.PLAYER=Player
economy.counterparty.COMPANY=Company
economy.counterparty.CITY=City
economy.counterparty.SETTLEMENT=Settlement
economy.counterparty.CONTRACT=Contract

transaction.type.STARTER_GRANT=Starting capital
transaction.type.ADMIN_GRANT=Admin deposit
transaction.type.ADMIN_REMOVAL=Admin withdrawal
transaction.type.PLAYER_PAYMENT=Payment
transaction.type.COMPANY_REGISTRATION_FEE=Registration fee
transaction.type.COMPANY_DEPOSIT=Deposit to company
transaction.type.COMPANY_WITHDRAWAL=Withdrawal from company
transaction.type.SALARY=Salary
transaction.type.CONTRACT_ESCROW=Contract escrow
transaction.type.CONTRACT_PAYOUT=Contract payout
transaction.type.CONTRACT_REFUND=Contract refund
transaction.type.PROPERTY_PURCHASE=Property purchase
transaction.type.SETTLEMENT_FEE=Settlement fee
transaction.type.DISSOLUTION_PAYOUT=Dissolution payout

# ── Skills ──
skill.MINING=Mining
skill.FARMING=Farming
skill.HERBALISM=Herbalism
skill.BUILDING=Building
skill.FORESTRY=Forestry
skill.FISHING=Fishing
skill.ENGINEERING=Engineering
skill.LOGISTICS=Logistics
skills.xp_gain=<gray>+<xp> <skill></gray> <dark_gray>·</dark_gray> <gray>Level <level></gray> <dark_gray>(<progress>%)</dark_gray>
skills.level_up=<prefix> <gold><skill></gold> <gray>reached level</gray> <gold><level></gold><gray>!</gray>
skills.level_up_title=<gold><skill></gold>
skills.level_up_subtitle=<gray>Level <white><level></white></gray>
skills.header=<prefix> <gray>Skills of <aqua><player></aqua>:</gray>
skills.entry=<gray> <skill>:</gray> <white>Level <level></white> <bar> <dark_gray><xp>/<next> XP</dark_gray>
skills.entry_max=<gray> <skill>:</gray> <gold>Level <level> (max)</gold> <dark_gray><xp> XP</dark_gray>
skills.top.header=<prefix> <gray>Leaderboard – <gold><skill></gold>:</gray>
skills.top.entry=<gray> <rank>. <aqua><player></aqua> – level <white><level></white> <dark_gray>(<xp> XP)</dark_gray>
skills.top.empty=<prefix> <gray>Nobody has trained this skill yet.</gray>
error.skills.unknown_skill=<prefix> <red>Unknown skill. Choose: mining, farming, herbalism, building, forestry, fishing, engineering, logistics.</red>

# ── Language ──
language.current=<prefix> <gray>Your language: <aqua><language></aqua>. Change with <white>/language sv</white> or <white>/language en</white>.</gray>
language.changed=<prefix> <green>Your language is now <language>.</green>
language.usage=<prefix> <gray>Usage: <white>/language sv</white> or <white>/language en</white></gray>
language.name.sv_SE=Svenska
language.name.en_US=English

# ── Administration ──
admin.eco.granted=<prefix> <green>Gave <gold><amount></gold> to <aqua><player></aqua>. New balance: <gold><balance></gold></green>
admin.eco.removed=<prefix> <green>Took <gold><amount></gold> from <aqua><player></aqua>. New balance: <gold><balance></gold></green>
admin.eco.balance=<prefix> <gray><aqua><player></aqua> has <gold><balance></gold></gray>
admin.eco.supply=<prefix> <gray>Money in circulation: <gold><supply></gold></gray>
admin.eco.audit_ok=<prefix> <green>The ledger is consistent. All balances match their transactions.</green>
admin.eco.audit_failed=<prefix> <red>The ledger is NOT consistent! Total: <total>. Mismatched accounts: <accounts></red>
nordia.info=<prefix> <gray>SwedenCore <white><version></white> — a player-driven society.</gray>
nordia.reloaded=<prefix> <green>Language files reloaded.</green>

# ── Errors ──
error.internal=<prefix> <red>Something went wrong. The incident has been logged.</red>
error.server_busy=<prefix> <red>The server is busy. Please try again shortly.</red>
error.too_many_requests=<prefix> <red>Please wait a moment before trying again.</red>
error.players_only=<prefix> <red>Only players can use this command.</red>
error.player.unknown=<prefix> <red>Player not found.</red>
error.economy.invalid_amount=<prefix> <red>Invalid amount. Examples: 150, 12.50 or 5k.</red>
error.economy.amount_too_large=<prefix> <red>The amount is too large. Maximum: <max>.</red>
error.economy.same_account=<prefix> <red>You cannot transfer money to the same account.</red>
error.economy.account_not_found=<prefix> <red>Account not found.</red>
error.economy.account_frozen=<prefix> <red>The account is frozen.</red>
error.economy.balance_overflow=<prefix> <red>The transaction would exceed the maximum balance.</red>
error.economy.insufficient_funds=<prefix> <red>You cannot afford that. Balance: <balance>.</red>
error.economy.pay_self=<prefix> <red>You cannot pay yourself.</red>
error.economy.idempotency_conflict=<prefix> <red>Transaction rejected (duplicate).</red>
