# NORDIA — svenska (standard)
# MiniMessage-format. Platshållare som <amount> fylls i av pluginet och tolkas aldrig som taggar.
# Varje nyckel måste finnas i alla språkfiler med samma platshållare (kontrolleras av tester).

prefix=<gradient:#3b82c4:#7cc4e8><bold>NORDIA</bold></gradient> <dark_gray>»</dark_gray>

# ── Inloggning ──
login.unavailable=<red>NORDIA är tillfälligt otillgängligt. Försök igen om en stund.</red>
join.welcome_first=<prefix> <gray>Välkommen till NORDIA, <aqua><player></aqua>! Du börjar med <gold><amount></gold>. Hitta ett jobb, lär dig ett yrke och bygg ditt liv.</gray>
join.welcome_back=<prefix> <gray>Välkommen tillbaka, <aqua><player></aqua>.</gray>

# ── Ekonomi ──
economy.balance.self=<prefix> <gray>Ditt saldo: <gold><balance></gold></gray>
