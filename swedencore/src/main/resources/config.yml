# ─────────────────────────────────────────────────────────────
#  SwedenCore — NORDIA configuration
# ─────────────────────────────────────────────────────────────

language:
  # Server default language: sv_SE or en_US. Players can override with /language.
  default: sv_SE

database:
  host: localhost
  port: 5432
  name: nordia
  user: nordia
  # Prefer the NORDIA_DB_PASSWORD environment variable in production. Never commit real passwords.
  # The default matches docker-compose.yml for local development only.
  password: nordia_dev_only
  ssl-mode: disable
  pool-size: 10
  connection-timeout-ms: 5000
  # A NORDIA server without its database must not run: economy actions would be lost.
  shutdown-server-on-failure: true

economy:
  # Amounts in SEK. Decimals allowed with , or . (max 2). Suffixes k and m are allowed.
  # One-time money created for each new player. This is a controlled mint (see GAME_DESIGN.md §3).
  starter-grant: "1000"
  # Upper bound for any single transfer.
  max-transfer: "100000000"
  # Smallest /pay amount.
  min-payment: "0.01"

companies:
  # Paid by the founder. Destroyed (money sink) until cities can receive fees.
  registration-fee: "5000"
  max-owned-companies: 3
  max-open-positions: 20
  max-salary-per-hour: "100000"
  max-pending-applications: 10
  # Verified work minutes are paid in batches this often (1-60).
  payroll-interval-minutes: 5
  # Company reputation change for every payroll batch it cannot pay.
  wage-default-reputation: -1

contracts:
  # Creation fee as % of the reward (money sink). Makes collusive round-trips cost something.
  fee-percent: 2
  max-active-per-issuer: 10
  max-active-per-contractor: 5
  max-duration-hours: 720
  # Contract XP (only with a skill requirement) = reward SEK / sek-per-xp, capped.
  sek-per-xp: 20
  max-xp-per-contract: 5000
  # Contracts below this reward give no reputation. Reputation is granted once per issuer/contractor pair per day.
  min-reward-for-reputation: "500"
  reputation:
    contractor-completed: 2
    issuer-completed: 1
    abandoned: -3
    expired: -2

properties:
  max-owned-per-player: 10
  # Largest property region in blocks (width × length × height).
  max-volume: 2000000
  max-trusted: 20
  # City land outside properties is public space: nobody builds there (admins with nordia.admin.property.bypass can).
  protect-city-land: true

skills:
  max-level: 100
  # XP to advance from level L to L+1 = base * L^exponent
  level-curve:
    base: 50
    exponent: 1.5
  # XP per skill per rolling hour before diminishing returns. 0 disables the cap for that skill.
  hourly-soft-cap:
    MINING: 6000
    FARMING: 6000
    HERBALISM: 3000
    BUILDING: 3000
    FORESTRY: 6000
    FISHING: 6000
    ENGINEERING: 6000
    LOGISTICS: 6000
  # Percentage of XP still granted above the soft cap.
  soft-cap-percent: 25
  # Extra XP for work in the skill of your on-duty job.
  employment-bonus-percent: 10
  # Without real input (turning, chatting, commands, inventory clicks) for this long a player is AFK.
  afk-threshold-seconds: 180
  flush-interval-seconds: 30
  # Placed building blocks must still stand after this long to give Building XP.
  building-maturity-seconds: 300
