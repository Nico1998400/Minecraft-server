name: SwedenCore
version: '${version}'
main: se.nordia.swedencore.SwedenCorePlugin
api-version: '26.2'
description: NORDIA — player-driven Minecraft society MMO core
authors: [NORDIA]
load: POSTWORLD

permissions:
  nordia.admin:
    description: All NORDIA administration permissions
    default: op
    children:
      nordia.admin.economy: true
      nordia.admin.reload: true
      nordia.balance.others: true
      nordia.admin.property: true
      nordia.admin.city: true
  nordia.admin.property:
    description: Define and delete properties
    default: op
  nordia.admin.city:
    description: Create cities
    default: op
  nordia.admin.property.bypass:
    description: Build anywhere regardless of property protection (not granted by nordia.admin)
    default: false
  nordia.admin.economy:
    description: Grant/remove money, audit the ledger
    default: op
  nordia.admin.reload:
    description: Reload language files
    default: op
  nordia.balance.others:
    description: View other players' balances
    default: op
